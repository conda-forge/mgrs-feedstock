schema_version: 1

context:
  name: mgrs
  version: "1.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f9b5d1d36e78191e7385fdcbe90f025d63aa0f417452fd4af1351d977cb7d9ee

build:
  number: 0
  skip: "(win and vc<14) or (python_impl == 'pypy')"
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
        - scikit-build-core
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - scikit-build-core
  host:
    - python
    - pip
    - uv
    - scikit-build-core
    - pybind11
  run:
    - python

tests:
  - python:
      imports:
        - mgrs
  - requirements:
      run:
        - pip
        - python
    script:
      - pip check

about:
  license: MIT
  license_file: LICENSE
  summary: MGRS coordinate conversion for Python
  homepage: https://github.com/hobu/mgrs
  repository: https://github.com/hobu/mgrs

extra:
  recipe-maintainers:
    - mukhery
    - mxr-conda
    - benhuff
    - oblute
    - rluria14
    - hobu
